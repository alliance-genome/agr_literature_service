# java.util.logging config for the Kafka Connect (dbz_connector) JVM.
#
# Kafka Connect's REST server uses Jersey, which logs through java.util.logging, not log4j.
# JUL's ConsoleHandler always writes to stderr, and the Docker GELF driver labels every stderr
# line ERROR. So each Connect start sent 16 harmless Jersey startup warnings ("A provider ...
# registered in SERVER runtime does not implement any provider interfaces", "... contains empty
# path annotation") to the log-error alerts. Jersey still reports SEVERE.
handlers=java.util.logging.ConsoleHandler
.level=INFO
java.util.logging.ConsoleHandler.level=ALL
org.glassfish.jersey.level=SEVERE
