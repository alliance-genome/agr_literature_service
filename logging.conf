[loggers]
keys=root,boto3,botocore,s3transfer,urllib3,elasticsearch

[handlers]
keys=consoleHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler

# Cap noisy third-party loggers: with disable_existing_loggers=False they
# inherit root's DEBUG, and botocore at DEBUG logs AWS request-signing
# material (CanonicalRequest/StringToSign/Signature) into web-served logs.
# Empty handlers= means records propagate to the root handler; the level
# here just filters out DEBUG/INFO chatter.

[logger_boto3]
level=WARNING
handlers=
qualname=boto3

[logger_botocore]
level=WARNING
handlers=
qualname=botocore

[logger_s3transfer]
level=WARNING
handlers=
qualname=s3transfer

[logger_urllib3]
level=WARNING
handlers=
qualname=urllib3

[logger_elasticsearch]
level=WARNING
handlers=
qualname=elasticsearch

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=simpleFormatter
args=(sys.stdout,)

[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=
