version: "3.7"

services:
  postgres:
    image: postgres:17-alpine
    hostname: postgres
    restart: always
    environment:
      POSTGRES_USER: ${PSQL_USERNAME}
      POSTGRES_PASSWORD: ${PSQL_PASSWORD}
      POSTGRES_DB: ${PSQL_DATABASE}
    shm_size: '1g'
    volumes:
      - "agr-literature-pg-data:/var/lib/postgresql/data"
      - "./postgresql.conf:/etc/postgresql.conf"
    networks:
      - agr-literature
    # ports needed by pgadmin to connect through host.docker.internal
    ports:
      - "${PSQL_PORT}:${PSQL_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PSQL_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      postgres -c config_file=/etc/postgresql.conf -p ${PSQL_PORT}


  pgadmin:
    image: dpage/pgadmin4:9.16
    hostname: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_ACCESS_CONTROL_ALLOW_ORIGIN: "*"
      PGADMIN_LISTEN_PORT: 81
    ports:
      - "${PGADMIN_PORT}:81"
    volumes:
      - "agr-literature-pgadmin-data:/var/lib/pgadmin"
    networks:
      - agr-literature
    extra_hosts:
      - "host.docker.internal:host-gateway"


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.10.1
    hostname: elasticsearch
    restart: always
    environment:
      - node.name=aws-literature-es1
      - cluster.name=es-docker-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms${ES_HEAP:-512m} -Xmx${ES_HEAP:-512m}"
      - "http.cors.enabled=true"
      - "http.cors.allow-origin=*"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - "agr-literature-es-data:/usr/share/elasticsearch/data"
    ports:
      - "${ELASTICSEARCH_PORT}:${ELASTICSEARCH_PORT}"
    networks:
      - agr-literature
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    container_name: agr.literature.${ENV_STATE}.api.server.${COMPOSE_PROJECT_NAME}
    restart: always
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://logs.alliancegenome.org:12201'
    build:
      context: .
      dockerfile: docker/api.dockerfile
      args:
        REG: ${REG}
        ALLIANCE_RELEASE: ${ALLIANCE_RELEASE}
    environment:
      API_PORT: "${API_PORT}"
      API_SERVER: "${API_SERVER}"
      PYTHONPATH: "/usr/local/bin/src/literature/"
      XML_PATH: "/usr/local/bin/src/literature/agr_literature_service/lit_processing/data_ingest/tmp/"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      COGNITO_ADMIN_CLIENT_ID: "${COGNITO_ADMIN_CLIENT_ID}"
      COGNITO_ADMIN_CLIENT_SECRET: "${COGNITO_ADMIN_CLIENT_SECRET}"
      COGNITO_TOKEN_URL: "${COGNITO_TOKEN_URL}"
      ENV_STATE: "${ENV_STATE}"
      ID_MATI_URL: "${ID_MATI_URL}"
      PSQL_USERNAME: "${PSQL_USERNAME}"
      PSQL_PASSWORD: "${PSQL_PASSWORD}"
      PSQL_HOST: "${PSQL_HOST}"
      PSQL_PORT: "${PSQL_PORT}"
      PSQL_DATABASE: "${PSQL_DATABASE}"
      PERSISTENT_STORE_DB_USERNAME: "${PERSISTENT_STORE_DB_USERNAME}"
      PERSISTENT_STORE_DB_PASSWORD: "${PERSISTENT_STORE_DB_PASSWORD}"
      PERSISTENT_STORE_DB_HOST: "${PERSISTENT_STORE_DB_HOST}"
      PERSISTENT_STORE_DB_PORT: "${PERSISTENT_STORE_DB_PORT}"
      PERSISTENT_STORE_DB_NAME: "${PERSISTENT_STORE_DB_NAME}"
      HOST: "${HOST}"
      COGNITO_REGION: "${COGNITO_REGION}"
      COGNITO_USER_POOL_ID: "${COGNITO_USER_POOL_ID}"
      COGNITO_CLIENT_ID: "${COGNITO_CLIENT_ID}"
      COGNITO_ALLOWED_CLIENT_IDS: "${COGNITO_ALLOWED_CLIENT_IDS}"
      OKTA_DOMAIN: "${OKTA_DOMAIN}"
      OKTA_API_AUDIENCE: "${OKTA_API_AUDIENCE}"
      OKTA_CLIENT_ID: "${OKTA_CLIENT_ID}"
      OKTA_CLIENT_SECRET: "${OKTA_CLIENT_SECRET}"
      ELASTICSEARCH_HOST: "${ELASTICSEARCH_HOST}"
      ELASTICSEARCH_PORT: "${ELASTICSEARCH_PORT}"
      ELASTICSEARCH_INDEX: "${ELASTICSEARCH_INDEX}"
      LOG_PATH: "/var/log/automated_scripts/"
      LOG_URL: "${LOG_URL}"
      CRONTAB_EMAIL: "${CRONTAB_EMAIL}"
      SENDER_EMAIL: "${SENDER_EMAIL}"
      SENDER_PASSWORD: "${SENDER_PASSWORD}"
      REPLY_TO: "${REPLY_TO}"
      ATEAM_API_URL: "${ATEAM_API_URL}"
      ATEAM_FETCH_TTL_SECONDS: "${ATEAM_FETCH_TTL_SECONDS:-900}"
      ATEAM_FETCH_TIMEOUT_SECONDS: "${ATEAM_FETCH_TIMEOUT_SECONDS:-5}"
      SGD_API_URL: "${SGD_API_URL}"
      PDFX_API_URL: "${PDFX_API_URL}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-4}"  # Number of worker processes (default: 4)
      LOG_LEVEL: "${LOG_LEVEL:-info}"  # Gunicorn log level (default: info)
      DEBEZIUM_STATUS_PATH: "${DEBEZIUM_STATUS_PATH:-/var/lib/debezium_status}"
      SKIP_AUTH_ON_READ_ENDPOINTS_FOR_IP: "${SKIP_AUTH_ON_READ_ENDPOINTS_FOR_IP}"
      SKIP_AUTH_ON_ALL_ENDPOINTS_FOR_IP: "${SKIP_AUTH_ON_ALL_ENDPOINTS_FOR_IP}"
    hostname: literature_api
    networks:
      - agr-literature
    volumes:
      - "${LOG_PATH}:/var/log/automated_scripts"
      - "${DEBEZIUM_STATUS_PATH:-agr-literature-debezium-status}:/var/lib/debezium_status"
    ports:
      - "${API_PORT}:8080"

  xml_processing:
    container_name: agr.literature.${ENV_STATE}.xml_processing.${COMPOSE_PROJECT_NAME}
    restart: always
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://logs.alliancegenome.org:12201'
    build:
      context: .
      dockerfile: docker/xml_processing.dockerfile
      args:
        REG: ${REG}
        ALLIANCE_RELEASE: ${ALLIANCE_RELEASE}
    hostname: literature_xml_processing
    environment:
      API_PORT: "${API_PORT}"
      API_SERVER: "${API_SERVER}"
      PYTHONPATH: "/usr/local/bin/src/literature/"
      XML_PATH: "/usr/local/bin/src/literature/agr_literature_service/lit_processing/data_ingest/tmp/"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      COGNITO_ADMIN_CLIENT_ID: "${COGNITO_ADMIN_CLIENT_ID}"
      COGNITO_ADMIN_CLIENT_SECRET: "${COGNITO_ADMIN_CLIENT_SECRET}"
      COGNITO_TOKEN_URL: "${COGNITO_TOKEN_URL}"
      ENV_STATE: "${ENV_STATE}"
      ID_MATI_URL: "${ID_MATI_URL}"
      HOST: "${HOST}"
      COGNITO_REGION: "${COGNITO_REGION}"
      COGNITO_USER_POOL_ID: "${COGNITO_USER_POOL_ID}"
      COGNITO_CLIENT_ID: "${COGNITO_CLIENT_ID}"
      OKTA_DOMAIN: "${OKTA_DOMAIN}"
      OKTA_API_AUDIENCE: "${OKTA_API_AUDIENCE}"
      OKTA_CLIENT_ID: "${OKTA_CLIENT_ID}"
      OKTA_CLIENT_SECRET: "${OKTA_CLIENT_SECRET}"
      PSQL_USERNAME: "${PSQL_USERNAME}"
      PSQL_PASSWORD: "${PSQL_PASSWORD}"
      PSQL_HOST: "${PSQL_HOST}"
      PSQL_PORT: "${PSQL_PORT}"
      PSQL_DATABASE: "${PSQL_DATABASE}"
      REG: "${REG}"
    networks:
      - agr-literature
    volumes:
      - agr-logs:/logs
    depends_on:
      - api

  automated_scripts:
    container_name: agr.literature.${ENV_STATE}.automated_scripts.${COMPOSE_PROJECT_NAME}
    restart: always
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://logs.alliancegenome.org:12201'
    build:
      context: .
      dockerfile: docker/automated_scripts.dockerfile
      args:
        REG: ${REG}
        ALLIANCE_RELEASE: ${ALLIANCE_RELEASE}
    environment:
      PYTHONPATH: "/usr/src/app"
      XML_PATH: "/usr/src/app/agr_literature_service/lit_processing/data_ingest/tmp/"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      COGNITO_ADMIN_CLIENT_ID: "${COGNITO_ADMIN_CLIENT_ID}"
      COGNITO_ADMIN_CLIENT_SECRET: "${COGNITO_ADMIN_CLIENT_SECRET}"
      COGNITO_TOKEN_URL: "${COGNITO_TOKEN_URL}"
      ENV_STATE: "${ENV_STATE}"
      ID_MATI_URL: "${ID_MATI_URL}"
      HOST: "${HOST}"
      COGNITO_REGION: "${COGNITO_REGION}"
      COGNITO_USER_POOL_ID: "${COGNITO_USER_POOL_ID}"
      COGNITO_CLIENT_ID: "${COGNITO_CLIENT_ID}"
      OKTA_DOMAIN: "${OKTA_DOMAIN}"
      OKTA_API_AUDIENCE: "${OKTA_API_AUDIENCE}"
      OKTA_CLIENT_ID: "${OKTA_CLIENT_ID}"
      OKTA_CLIENT_SECRET: "${OKTA_CLIENT_SECRET}"
      PSQL_USERNAME: "${PSQL_USERNAME}"
      PSQL_PASSWORD: "${PSQL_PASSWORD}"
      PSQL_HOST: "${PSQL_HOST}"
      PSQL_PORT: "${PSQL_PORT}"
      PSQL_DATABASE: "${PSQL_DATABASE}"
      REG: "${REG}"
      NCBI_API_KEY: "${NCBI_API_KEY}"
      LOG_PATH: "/var/log/automated_scripts/"
      LOG_URL: "${LOG_URL}"
      CRONTAB_EMAIL: "${CRONTAB_EMAIL}"
      SENDER_EMAIL: "${SENDER_EMAIL}"
      SENDER_PASSWORD: "${SENDER_PASSWORD}"
      REPLY_TO: "${REPLY_TO}"
      ELASTICSEARCH_HOST: "${ELASTICSEARCH_HOST}"
      ELASTICSEARCH_PORT: "${ELASTICSEARCH_PORT}"
      ELASTICSEARCH_INDEX: "${ELASTICSEARCH_INDEX}"
      API_PORT: "${API_PORT}"
      API_SERVER: "${API_SERVER}"
      ATEAM_API_URL: "${ATEAM_API_URL}"
      ATEAM_FETCH_TTL_SECONDS: "${ATEAM_FETCH_TTL_SECONDS:-900}"
      ATEAM_FETCH_TIMEOUT_SECONDS: "${ATEAM_FETCH_TIMEOUT_SECONDS:-5}"
      DEBEZIUM_CONNECTOR_HOST: "${DEBEZIUM_CONNECTOR_HOST}"
      DEBEZIUM_CONNECTOR_PORT: "${DEBEZIUM_CONNECTOR_PORT}"
      DEBEZIUM_INDEX_NAME: "${DEBEZIUM_INDEX_NAME}"
      DEBEZIUM_KSQLDB_HOST: "${DEBEZIUM_KSQLDB_HOST}"
      DEBEZIUM_KSQLDB_PORT: "${DEBEZIUM_KSQLDB_PORT}"
      TZ: "UTC"
      PDFX_API_URL: "${PDFX_API_URL}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      SGD_API_URL: "${SGD_API_URL}"
      PERSISTENT_STORE_DB_USERNAME: "${PERSISTENT_STORE_DB_USERNAME}"
      PERSISTENT_STORE_DB_PASSWORD: "${PERSISTENT_STORE_DB_PASSWORD}"
      PERSISTENT_STORE_DB_HOST: "${PERSISTENT_STORE_DB_HOST}"
      PERSISTENT_STORE_DB_PORT: "${PERSISTENT_STORE_DB_PORT}"
      PERSISTENT_STORE_DB_NAME: "${PERSISTENT_STORE_DB_NAME}"
    volumes:
      - "${LOG_PATH}:/var/log/automated_scripts"
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
      - /usr/local/bin/docker-compose:/usr/bin/docker-compose
    networks:
      - agr-literature

  test_runner:
    build:
      context: .
      dockerfile: docker/test_runner.dockerfile
      args:
        REG: ${REG}
        ALLIANCE_RELEASE: ${ALLIANCE_RELEASE}
    hostname: test_runner
    environment:
      API_PORT: "${API_PORT}"
      API_SERVER: "${API_SERVER}"
      PYTHONPATH: "/usr/local/bin/src/literature/"
      XML_PATH: "/usr/local/bin/src/literature/agr_literature_service/lit_processing/tests/tmp/"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      COGNITO_ADMIN_CLIENT_ID: "${COGNITO_ADMIN_CLIENT_ID}"
      COGNITO_ADMIN_CLIENT_SECRET: "${COGNITO_ADMIN_CLIENT_SECRET}"
      COGNITO_TOKEN_URL: "${COGNITO_TOKEN_URL}"
      ENV_STATE: "${ENV_STATE}"
      ID_MATI_URL: "${ID_MATI_URL}"
      HOST: "${HOST}"
      COGNITO_REGION: "${COGNITO_REGION}"
      COGNITO_USER_POOL_ID: "${COGNITO_USER_POOL_ID}"
      COGNITO_CLIENT_ID: "${COGNITO_CLIENT_ID}"
      COGNITO_ALLOWED_CLIENT_IDS: "${COGNITO_ALLOWED_CLIENT_IDS}"
      OKTA_DOMAIN: "${OKTA_DOMAIN}"
      OKTA_API_AUDIENCE: "${OKTA_API_AUDIENCE}"
      OKTA_CLIENT_ID: "${OKTA_CLIENT_ID}"
      OKTA_CLIENT_SECRET: "${OKTA_CLIENT_SECRET}"
      PSQL_USERNAME: "${PSQL_USERNAME}"
      PSQL_PASSWORD: "${PSQL_PASSWORD}"
      PSQL_HOST: "${PSQL_HOST}"
      PSQL_PORT: "${PSQL_PORT}"
      PSQL_DATABASE: "${PSQL_DATABASE}"
      ELASTICSEARCH_HOST: "${ELASTICSEARCH_HOST}"
      ELASTICSEARCH_PORT: "${ELASTICSEARCH_PORT}"
      ELASTICSEARCH_INDEX: "${ELASTICSEARCH_INDEX}"
      REG: "${REG}"
    volumes:
      - agr-logs:/logs
      - .:/usr/local/bin/src/literature
    networks:
      - agr-literature

  dev_app:
    restart: always
    build:
      context: .
      dockerfile: docker/dev-app.dockerfile
      args:
        REG: ${REG}
        ALLIANCE_RELEASE: ${ALLIANCE_RELEASE}
    hostname: dev_app
    environment:
      API_PORT: "8080"
      API_SERVER: "localhost"
      PYTHONPATH: "/usr/local/bin/src/literature/"
      XML_PATH: "/usr/local/bin/src/literature/agr_literature_service/lit_processing/data_ingest/tmp/"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      COGNITO_ADMIN_CLIENT_ID: "${COGNITO_ADMIN_CLIENT_ID}"
      COGNITO_ADMIN_CLIENT_SECRET: "${COGNITO_ADMIN_CLIENT_SECRET}"
      COGNITO_TOKEN_URL: "${COGNITO_TOKEN_URL}"
      ENV_STATE: "${ENV_STATE}"
      ID_MATI_URL: "${ID_MATI_URL}"
      ATEAM_API_URL: "${ATEAM_API_URL}"
      ATEAM_FETCH_TTL_SECONDS: "${ATEAM_FETCH_TTL_SECONDS:-900}"
      ATEAM_FETCH_TIMEOUT_SECONDS: "${ATEAM_FETCH_TIMEOUT_SECONDS:-5}"
      PDFX_API_URL: "${PDFX_API_URL}"
      PSQL_USERNAME: "${PSQL_USERNAME}"
      PSQL_PASSWORD: "${PSQL_PASSWORD}"
      PSQL_HOST: "${PSQL_HOST}"
      PSQL_PORT: "${PSQL_PORT}"
      PSQL_DATABASE: "${PSQL_DATABASE}"
      ELASTICSEARCH_HOST: "${ELASTICSEARCH_HOST}"
      ELASTICSEARCH_PORT: "${ELASTICSEARCH_PORT}"
      ELASTICSEARCH_INDEX: "${ELASTICSEARCH_INDEX}"
      HOST: "${HOST}"
      COGNITO_REGION: "${COGNITO_REGION}"
      COGNITO_USER_POOL_ID: "${COGNITO_USER_POOL_ID}"
      COGNITO_CLIENT_ID: "${COGNITO_CLIENT_ID}"
      COGNITO_ALLOWED_CLIENT_IDS: "${COGNITO_ALLOWED_CLIENT_IDS}"
      OKTA_DOMAIN: "${OKTA_DOMAIN}"
      OKTA_API_AUDIENCE: "${OKTA_API_AUDIENCE}"
      OKTA_CLIENT_ID: "${OKTA_CLIENT_ID}"
      OKTA_CLIENT_SECRET: "${OKTA_CLIENT_SECRET}"
      REG: "${REG}"
      SKIP_AUTH_ON_READ_ENDPOINTS_FOR_IP: "${SKIP_AUTH_ON_READ_ENDPOINTS_FOR_IP}"
      SKIP_AUTH_ON_ALL_ENDPOINTS_FOR_IP: "${SKIP_AUTH_ON_ALL_ENDPOINTS_FOR_IP}"
    ports:
      - "${API_PORT}:8080"
    networks:
      - agr-literature
    volumes:
      - agr-logs:/logs
      - .:/usr/local/bin/src/literature

  # SCRUM-6336: Kafka 4.1 in KRaft mode (single combined broker+controller). Replaces the old
  # ZooKeeper + Kafka 2.7 pair -- ZooKeeper is gone entirely (Kafka 4.x is KRaft-only). The broker
  # is intentionally plain apache/kafka (not the Debezium image) so it is decoupled from the
  # Debezium connector version. CLUSTER_ID is validated/reformatted at deploy (P2).
  dbz_kafka:
    container_name: agr.literature.${ENV_STATE}.dbz.kafka.${COMPOSE_PROJECT_NAME}
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://logs.alliancegenome.org:12201'
    image: apache/kafka:4.1.1
    ports:
      - 9092:9092
    environment:
      # --- KRaft combined broker + controller ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@dbz_kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://dbz_kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # single-node: everything replication-factor 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # large messages (carried over from the 2.7 stack -- big joined docs / batches)
      KAFKA_MESSAGE_MAX_BYTES: 200000000
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 200000000
      KAFKA_REPLICA_FETCH_MAX_BYTES: 200000000
      # stable cluster id (valid base64 16-byte UUID) so storage isn't reformatted on restart
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
    networks:
      - agr-literature

  dbz_connector:
    container_name: agr.literature.${ENV_STATE}.dbz.connector.${COMPOSE_PROJECT_NAME}
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://logs.alliancegenome.org:12201'
    # SCRUM-6336: plain Debezium 3.5 Connect image -- SOURCE ONLY (no ES sink jar any more; Flink is
    # the sink). Kafka scripts (kafka-topics.sh) still ship in this image for the make targets.
    image: quay.io/debezium/connect:${DEBEZIUM_VERSION}
    ports:
      - 8083:8083
    environment:
      - BOOTSTRAP_SERVERS=dbz_kafka:9092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_source_connect_configs
      - OFFSET_STORAGE_TOPIC=my_source_connect_offsets
      - STATUS_STORAGE_TOPIC=my_source_connect_statuses
      - CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE=false
      - CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE=false
      - KAFKA_JVM_PERFORMANCE_OPTS=-server -XX:+UseParallelGC -XX:MaxInlineLevel=15 -Djava.awt.headless=true
    networks:
      - agr-literature

  dbz_setup:
    container_name: agr.literature.${ENV_STATE}.dbz.setup.${COMPOSE_PROJECT_NAME}
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://logs.alliancegenome.org:12201'
    build:
      context: .
      dockerfile: docker/debezium_setup.dockerfile
    environment:
      ENV_STATE: "${ENV_STATE}"
      ELASTICSEARCH_HOST: "${ELASTICSEARCH_HOST}"
      ELASTICSEARCH_PORT: "${ELASTICSEARCH_PORT}"
      DEBEZIUM_CONNECTOR_HOST: "${DEBEZIUM_CONNECTOR_HOST}"
      DEBEZIUM_CONNECTOR_PORT: "${DEBEZIUM_CONNECTOR_PORT}"
      DEBEZIUM_INDEX_NAME: "${DEBEZIUM_INDEX_NAME}"
      DEBEZIUM_KSQLDB_HOST: "${DEBEZIUM_KSQLDB_HOST}"
      DEBEZIUM_KSQLDB_PORT: "${DEBEZIUM_KSQLDB_PORT}"
      PSQL_USERNAME: "${PSQL_USERNAME}"
      PSQL_PASSWORD: "${PSQL_PASSWORD}"
      PSQL_HOST: "${PSQL_HOST}"
      PSQL_PORT: "${PSQL_PORT}"
      PSQL_DATABASE: "${PSQL_DATABASE}"
      DEBEZIUM_STATUS_PATH: "${DEBEZIUM_STATUS_PATH:-/var/lib/debezium_status}"
      # Big production reindex waits, overridable per-deployment (e.g. prod's slower disk).
      # Defaults preserve current prod behavior; TEST mode ignores these (setup.sh keeps fixed test values).
      DBZ_KSQL_SETUP_SLEEP: "${DBZ_KSQL_SETUP_SLEEP:-1200}"
      DBZ_DATA_PROCESSING_SLEEP: "${DBZ_DATA_PROCESSING_SLEEP:-20000}"
    networks:
      - agr-literature
    volumes:
      - "${DEBEZIUM_STATUS_PATH:-agr-literature-debezium-status}:/var/lib/debezium_status"
    command:
      /setup.sh

  # SCRUM-6336: Flink 2.0.x replaces ksqlDB as the streaming-join engine (JobManager + TaskManager).
  # The SQL job (debezium/flink/*.sql) reads the Debezium 3.5 CDC topics, computes the reference /
  # public joins as clean multi-way joins, and writes directly to Elasticsearch 7.10 via the
  # flink-sql ES-7 upsert sink. Connector jars (flink-sql-connector-kafka 4.0.1,
  # flink-sql-connector-elasticsearch7 v4.0.0) are baked in by docker/flink.dockerfile.
  # Memory is hard-bounded via ONE managed-memory budget (the real fix for the ksqlDB OOM).
  flink_jobmanager:
    container_name: agr.literature.${ENV_STATE}.flink.jobmanager.${COMPOSE_PROJECT_NAME}
    # hostname must match jobmanager.rpc.address so pekko recognizes its own advertised address
    hostname: flink_jobmanager
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://logs.alliancegenome.org:12201'
    build:
      context: .
      dockerfile: docker/flink.dockerfile
    image: agr.literature.flink:2.0.2
    depends_on:
      - dbz_kafka
    ports:
      # host 18081 -> Flink web UI/REST 8081 (8081 is already used on the debezium test box)
      - "18081:8081"
      # host 18083 -> Flink SQL Gateway REST 8083 (the gateway runs in flink_sqlgateway, which
      # shares this container's netns, so its port is published here).
      - "18083:8083"
    command: jobmanager
    # NOTE: every line inside FLINK_PROPERTIES is parsed by the Flink entrypoint as a config entry,
    # so a '#' comment there is NOT a comment -- it lands in flink-conf.yaml as a junk key (and any
    # colon inside it splits into a bogus key/value). Keep explanation in YAML comments out here.
    #
    # restart-strategy: none, and checkpointing off. The reindex is a from-scratch, idempotent
    # (upsert-by-id) rebuild -- on failure we just re-run. Enabling checkpointing (without durable
    # checkpoint storage) made the growing 13-aggregate join state fail async snapshots and
    # restart-loop the job, so it never converged. Steady-state fault tolerance (checkpoint dir on a
    # shared volume) is P4.
    #
    # heartbeat.*: the reindex saturates the box (Flink + local ES on the same cores), so the
    # TaskManager's heartbeat thread can be starved or sat behind a long GC pause for well over
    # Flink's 50s default. With no restart strategy a single missed heartbeat kills the whole job --
    # observed at ~990s in, "heartbeat of TaskManager ... timed out", with the TM container still Up
    # and never restarted. Widen the window so only a genuinely dead TM fails the job.
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: localhost
        env.java.opts.all: -Djava.net.preferIPv4Stack=true -XX:+UseParallelGC
        rest.bind-address: 0.0.0.0
        parallelism.default: ${DBZ_FLINK_PARALLELISM:-2}
        state.backend.type: rocksdb
        restart-strategy: none
        jobmanager.memory.process.size: 1600m
        heartbeat.interval: ${DBZ_FLINK_HEARTBEAT_INTERVAL_MS:-30000}
        heartbeat.timeout: ${DBZ_FLINK_HEARTBEAT_TIMEOUT_MS:-180000}
    networks:
      - agr-literature

  flink_taskmanager:
    container_name: agr.literature.${ENV_STATE}.flink.taskmanager.${COMPOSE_PROJECT_NAME}
    # Share the JobManager's network namespace -> JM<->TM RPC is pure localhost, avoiding the
    # cross-container pekko self-association failure on this box's Docker network. Single-node
    # Flink (1 JM + 1 TM per box) is our deployment shape everywhere, so this is fine.
    network_mode: "service:flink_jobmanager"
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://logs.alliancegenome.org:12201'
    image: agr.literature.flink:2.0.2
    depends_on:
      - flink_jobmanager
    command: taskmanager
    # As on the JobManager, FLINK_PROPERTIES lines are config entries, not comments -- keep prose here.
    # taskmanager.memory.*: ONE bounded managed-memory budget for all operators' RocksDB state,
    # replacing ksqlDB's ~115 individually-unbounded stores. Sized for the 30 GB test box; tune per
    # box via env. heartbeat.* must match the JobManager's -- see the note on that service.
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: localhost
        env.java.opts.all: -Djava.net.preferIPv4Stack=true -XX:+UseParallelGC
        taskmanager.host: localhost
        taskmanager.numberOfTaskSlots: ${DBZ_FLINK_TASK_SLOTS:-4}
        parallelism.default: ${DBZ_FLINK_PARALLELISM:-2}
        state.backend.type: rocksdb
        taskmanager.memory.process.size: ${DBZ_FLINK_TM_PROCESS_SIZE:-12g}
        taskmanager.memory.managed.fraction: ${DBZ_FLINK_MANAGED_FRACTION:-0.5}
        heartbeat.interval: ${DBZ_FLINK_HEARTBEAT_INTERVAL_MS:-30000}
        heartbeat.timeout: ${DBZ_FLINK_HEARTBEAT_TIMEOUT_MS:-180000}

  # SCRUM-6336: Flink SQL Gateway -- lets the reindex orchestrator (setup_flink.sh) submit SQL over
  # REST with curl, staying container-friendly like the old ksqlDB setup. Shares the JobManager netns
  # so it reaches the JM on localhost (same pekko-avoidance as the TaskManager); its REST is published
  # via the JobManager's 18083->8083 mapping.
  flink_sqlgateway:
    container_name: agr.literature.${ENV_STATE}.flink.sqlgateway.${COMPOSE_PROJECT_NAME}
    network_mode: "service:flink_jobmanager"
    logging:
      driver: gelf
      options:
        gelf-address: 'udp://logs.alliancegenome.org:12201'
    image: agr.literature.flink:2.0.2
    depends_on:
      - flink_jobmanager
      - flink_taskmanager
    command: >
      bash -c "/opt/flink/bin/sql-gateway.sh start-foreground
      -Dsql-gateway.endpoint.type=rest
      -Dsql-gateway.endpoint.rest.address=0.0.0.0
      -Dsql-gateway.endpoint.rest.port=8083"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: localhost
        rest.address: localhost
        parallelism.default: ${DBZ_FLINK_PARALLELISM:-2}
        env.java.opts.all: -Djava.net.preferIPv4Stack=true -XX:+UseParallelGC

  jenkins:
    image: jenkins/jenkins:2.540-jdk21
    volumes:
      - /usr/share/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
      - /usr/local/bin/docker-compose:/usr/bin/docker-compose
      - /usr/share/agr_env_files/.env.rdsdev_4001:/usr/share/agr_env_files/.env.api
      - /usr/share/agr_env_files/.env.dev_3001:/usr/share/agr_env_files/.env.ui
    ports:
      - "49001:8080"
      - "50000:50000"
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  file_uploader:
    build:
      context: .
      dockerfile: docker/file_uploader.dockerfile
    environment:
      - COGNITO_REGION=$COGNITO_REGION
      - COGNITO_USER_POOL_ID=$COGNITO_USER_POOL_ID
      - COGNITO_CLIENT_ID=$COGNITO_CLIENT_ID
      - COGNITO_ADMIN_CLIENT_ID=$COGNITO_ADMIN_CLIENT_ID
      - COGNITO_ADMIN_CLIENT_SECRET=$COGNITO_ADMIN_CLIENT_SECRET
      - COGNITO_TOKEN_URL=$COGNITO_TOKEN_URL
      - API_PORT=$API_PORT
      - API_SERVER=$API_SERVER

  reverse_proxy:
    build:
      context: ./reverse_proxy
      dockerfile: Dockerfile
      args:
        BUILD_ENV: ${BUILD_ENV:-dev}
    ports:
      - "80:80"
    networks:
      - agr-literature
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /home:/home:ro
      - /var/www:/var/www:ro
      - /var/log/agr_literature_service:/var/log/agr_literature_service:ro

volumes:
  agr-literature-pg-data:
  agr-literature-pgadmin-data:
  agr-literature-es-data:
  agr-logs:
  agr-literature-debezium-status:

networks:
  agr-literature:
